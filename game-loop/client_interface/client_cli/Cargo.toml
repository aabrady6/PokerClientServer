[package]
name = "client_cli"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_url_params = "0.2"
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
url = "2.4"
rand = "0.8"
dotenv = "0.15.0"